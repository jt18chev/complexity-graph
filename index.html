
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Complexity Class Explorer</title>
  
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
  }

  body {
    height: 100vh;
    height: 100dvh;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow: hidden;
    font-family: system-ui, sans-serif;
    background: #f7f8fa;
    color: #202938;
  }

  header {
    flex-shrink: 0;
  }

  header h1 {
    margin: 0 0 4px;
    font-size: 1.5rem;
  }

  header p {
    margin: 0;
  }

  #cy {
    flex: 1;
    min-height: 0;
    width: 100%;
    background: white;
    border: 1px solid #d8dee8;
    border-radius: 10px;
  }

  #details {
    flex-shrink: 0;
    max-height: 25%;
    overflow-y: auto;
    padding: 12px 16px;
    background: white;
    border: 1px solid #d8dee8;
    border-radius: 10px;
  }

  #details h2 {
    margin: 0 0 6px;
    font-size: 1.1rem;
  }

  #description {
    margin: 0;
  }
</style>

</head>
<body>
  <header>
    <h1>Complexity Class Explorer</h1>
    <p>Click a class to learn more about it.</p>
  </header>
    
  <div id="cy"></div>

  <section id="details">
    <h2>Class details</h2>
    <p id="description">Select a node in the graph.</p>
  </section>

  <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
  <script src="graph.js"></script>
</body>
</html>
